# Site settings
title: 마음의 정원
description: "내가 좋아하는건 뭔지, 내가 잘하는건 뭔지, 나에 대해 아는 것이 없다고 느껴질때 마음의 정원으로 오세요."
url: "https://www.tookheelab.com"
author:
  name: "툭히(took-hee)"
  email: "gardener.tookhee@gmail.com"  
  url: "https://www.tookheelab.com"

# Build settings
baseurl: ""
markdown: kramdown
kramdown:
  hard_wrap: true           # 단순 줄바꿈 인식
  parse_block_html: true    # HTML 블록 파싱
  parse_span_html: true     # HTML 인라인 파싱
  input: GFM               # GitHub Flavored Markdown
  syntax_highlighter: rouge
source: .
destination: ./_site
permalink: /:title
paginate: 8
paginate_path: /page:num/

# Default values
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Plugins
gems:
  - jekyll-paginate
  - jekyll-sitemap

# Custom variables
version: "1.0.0"

# Options
custom_header: false
custom_nav_footer: false
reverse: false

# google analytics
google_analytics: G-GYJHKW4Q3L

